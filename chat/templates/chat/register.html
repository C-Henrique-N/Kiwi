<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Kris - Criar Conta</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #1e1f22;
            background-image: radial-gradient(circle at center, #2b2d31 0%, #111214 100%);
            color: #dbdee1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 16px;
        }

        .auth-container {
            width: 780px;
            max-width: 100%;
            min-height: 460px;
            background: #2b2d31;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            border: 1px solid #3f4147;
            display: flex;
            overflow: hidden;
        }

        .auth-image-side {
            width: 380px;
            background: #85586F;
            background-size: cover;
            background-position: center;
            background-image: url('https://i.pinimg.com/736x/cb/a2/98/cba29832d5a423e62dc7ed952df60762.jpg');
            position: relative;
            flex-shrink: 0;
        }
        .auth-image-side::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.15);
        }

        .auth-form-side {
            flex: 1;
            background: #2b2d31;
            padding: 30px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #949ba4;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .brand-dot {
            width: 8px;
            height: 8px;
            background: #8a63d2;
            border-radius: 50%;
        }

        h2 { color: #fff; font-size: 22px; margin-bottom: 14px; font-weight: bold; }

        p { margin-bottom: 10px; }
        p label { display: block; font-size: 10px; text-transform: uppercase; font-weight: bold; color: #949ba4; margin-bottom: 3px; }
        p input { width: 100%; background: #1e1f22; border: 1px solid #3f4147; color: #fff; padding: 8px 10px; border-radius: 6px; outline: none; font-size: 13px; }
        p input:focus { border-color: #8a63d2; }
        .helptext, .help-text { font-size: 9px; color: #949ba4; margin-top: 2px; display: block; line-height: 1.3; }
        .errorlist { color: #f23f43; font-size: 11px; list-style: none; padding: 0; margin-bottom: 6px; }

        button {
            width: 100%;
            background: #8a63d2;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        button:hover { filter: brightness(1.1); }

        .auth-footer {
            margin-top: 12px;
            font-size: 12px;
            color: #949ba4;
            text-align: left;
        }
        .auth-footer a { color: #a482eb; text-decoration: none; font-weight: 500; }
        .auth-footer a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .auth-container {
                width: 100%;
                max-width: 420px;
                min-height: auto;
                flex-direction: column;
            }

            .auth-image-side {
                width: 100%;
                height: 160px;
            }

            .auth-form-side {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-image-side"></div>
        <div class="auth-form-side">
            <div class="brand-header">
                <div class="brand-dot"></div> Kiwi Chat
            </div>
            <h2>Criar Conta</h2>
            <form method="post">
                {% csrf_token %}
                {% if error %}
                    <ul class="errorlist"><li>{{ error }}</li></ul>
                {% endif %}
                <p>
                    <label for="id_username">Utilizador</label>
                    <input type="text" id="id_username" name="username" required autocomplete="username">
                </p>
                <p>
                    <label for="id_password">Palavra-passe</label>
                    <input type="password" id="id_password" name="password" required autocomplete="new-password">
                </p>
                <button type="submit">Registar</button>
            </form>
            <div class="auth-footer">
                Já possui uma conta? <a href="{% url 'login' %}">Entrar</a>
            </div>
        </div>
    </div>
</body>
</html>
